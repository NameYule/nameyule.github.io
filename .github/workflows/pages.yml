# Builds the Hexo site and publishes it to GitHub Pages on every push to master.
# Publishing source in repo Settings > Pages must be set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# GITHUB_TOKEN gets exactly the rights this workflow needs and nothing more.
# id-token: write is required so deploy-pages can request an OIDC token and
# verify the deployment really came from this repo/ref.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Never cancel an in-flight production deploy —
# a later push queues behind it instead of tearing the live site down mid-way.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hexo
        run: npx hexo clean && npx hexo generate

      # Paths are relative to public/. Hidden files are dropped by default;
      # add `include-hidden-files: true` if you ever need .well-known/ etc.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
