# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Theme: https://ppoffice.github.io/hexo-theme-icarus/

# Site
title: 老于乐
subtitle: ''
description: '一切过往, 皆为序章'
keywords: 产品, 项目, 生活, 职场
author: Eric Hu
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Production domain — this is a user site (nameyule.github.io) with a custom
## domain, so root is '/'. Never leave a localhost URL here: it leaks into
## canonical links, sitemap.xml and the Atom feed.
url: https://hyh.im
root: /
permalink: posts/:name/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags/
archive_dir: archives/
category_dir: categories/
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
## Permalink uses :name (bare filename), NOT :title — :title includes the
## directory path, which is how slugs like "tech-coding-2020-07-14-..."
## got into URLs in the first place. Keep posts in category folders freely.
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true

highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 20

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## 'date' rather than the default 'mtime': file mtimes are reset on every
## git checkout, so 'mtime' would make build output non-reproducible in CI.
updated_option: 'date'

# Pagination
per_page: 20
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: icarus

# Deployment is handled by .github/workflows/pages.yml (GitHub Actions),
# not by `hexo deploy` pushing to a gh-pages branch.

archive_generator:
  per_page: 12
  yearly: true
  monthly: true
  daily: false

server:
  port: 4666

# Markdown
marked:
  smartypants: false

# Atom feed — replaces the old hexo-feed + custom atom.ejs setup
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  icon: images/logo.svg

# Sitemap
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true
